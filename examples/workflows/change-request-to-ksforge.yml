name: Change Request to ksforge

# Ready-to-copy template: paste this into <your-repo>/.github/workflows/,
# set the ANTHROPIC_API_KEY secret, and (if you want ksforge to open PRs)
# enable "Allow GitHub Actions to create and approve pull requests" —
# see docs/07-github-actions.md in the ksforge repo for both. Pin
# chevp/ksforge@<tag> to a real release (see GitHub Releases) rather than
# leaving it at a placeholder version.

on:
  workflow_dispatch:
    inputs:
      change_request:
        description: 'Change Request als Markdown/Text'
        required: true
        type: string
      capability:
        description: 'Was ksforge tun soll'
        required: false
        type: choice
        default: implement
        options:
          - implement
          - review
          - fix
          - explain

permissions:
  contents: write
  pull-requests: write

env:
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Process change request with ksforge
        uses: chevp/ksforge@v1
        with:
          change-request: ${{ inputs.change_request }}
          capability: ${{ inputs.capability }}
          format: json
          create-pull-request: "true"
          base-branch: main
