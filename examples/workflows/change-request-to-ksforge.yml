name: Change Request to ksforge

# Ready-to-copy template: paste this into <your-repo>/.github/workflows/,
# set the ANTHROPIC_API_KEY secret, and (if you want ksforge to open PRs)
# enable "Allow GitHub Actions to create and approve pull requests" —
# see docs/07-github-actions.md in the ksforge repo for both. Pin
# chevp/ksforge@<tag> to a real release (see GitHub Releases) rather than
# leaving it at a placeholder version.
#
# Always implement: a "change request" is a request to change something,
# not to review or explain it — those are different capabilities with
# different (read-only) semantics, not a choice that belongs on this input.
# Use `ksforge review`/`ksforge explain` directly (see docs/04-cli-reference.md)
# if you want a workflow for those instead.

on:
  workflow_dispatch:
    inputs:
      change_request:
        description: 'Change Request als Markdown/Text'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

env:
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Process change request with ksforge
        uses: chevp/ksforge@v1
        with:
          change-request: ${{ inputs.change_request }}
          capability: implement
          format: json
          create-pull-request: "true"
          base-branch: main
